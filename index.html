<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Restaurante</title>
<meta name="theme-color" content="#e8590c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Restaurante"><link rel="icon" type="image/png" sizes="64x64" href="favicon-64-v2.png"><link rel="apple-touch-icon" href="apple-touch-icon-v2.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="rn" id="rn" onclick="askName()"></div><div class="top" id="top"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div id="nm" class="ov" style="display:none"><div class="box"><h2>🍽️ ¡Bienvenido!</h2><p>Ponle un nombre a tu restaurante:</p><input id="nmi" maxlength="24" placeholder="Ej.: La Cocina de Ana" onkeydown="if(event.key==='Enter')setName()"><button class="big" onclick="setName()">Abrir mi restaurante</button></div></div>
<div id="rs" class="ov" style="display:none"><div class="box"><h2>¿Reiniciar la partida?</h2><p>Se borrará todo tu progreso y empezarás de cero.</p><button class="big" onclick="resetGo()">Sí, reiniciar</button><button class="s" style="margin-top:8px" onclick="document.getElementById('rs').style.display='none'">Cancelar</button></div></div>
<script src="js/datos.js"></script>
<script src="js/guardado.js"></script>

<script src="js/vista.js"></script>
<script src="js/catalogo.js"></script>

<script src="js/audio.js"></script>

<script src="js/estadisticas.js"></script>
<script src="js/inicio.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
