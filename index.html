  const bar=sel&&!busy&&ARR(sel[0])[+sel.slice(1)]?`<div class="card"><div class="row" style="flex-wrap:wrap;justify-content:flex-start">${sel[0]==="k"?"":`<button class="s" onclick="store()">📦 Guardar</button>`}${sel[0]==="t"?`<button class="s" onclick="store(1)">📦 Con sus sillas</button>`:""}${sel[0]==="k"&&(ARR("k")[+sel.slice(1)][2]<4||ARR("k")[+sel.slice(1)][2]===9)?"":`<button class="s" onclick="sellSel()">💰 Vender +${half(sel[0],ARR(sel[0])[+sel.slice(1)][2])} 🪙</button>`}</div></div>`:"";
  let body="";
  if(ccat==="i"){body=["t","c","b","s","p","d"].map(k=>{const cs={};iv[k].forEach(s=>cs[s]=(cs[s]||0)+1);return Object.keys(cs).map(s=>{s=+s;const on=pick&&pick.k===k&&pick.s===s;return `<div class="card"><div class="row">${k==="p"||k==="d"?`<div class="mini sm"><span class="sv">${thumb(k,s)}</span></div>`:`<div class="mini sm"><div class="isom"${k==="b"?' style="transform:scale(.32) rotateX(60deg) rotateZ(45deg)"':""}>${thumb(k,s)}</div></div>`}<div style="flex:1"><b>${label(k,s)}</b><div class="mut">× ${cs[s]}</div></div><div><button class="s" onclick="invPick('${k}',${s})" ${busy?"disabled":""}>${on?"✔ Colocando":"Colocar"}</button> <button class="s" onclick="invSell('${k}',${s})">+${half(k,s)} 🪙</button></div></div></div>`}).join("")}).join("")||`<p class="mut">El inventario está vacío. Compra muebles en el catálogo o guarda los del salón.</p>`}
  else if(ccat==="f"||ccat==="w")body=`<div class="grid">${OPT[ccat].map((o,i)=>{const own=S.own.includes(ccat+i),use=S.look[ccat]===i;return `<div class="card item">${pv(ccat,i)}<b>${o[0]}</b><div class="mut">${own?(use?"✔ En uso":"Tuyo"):stp(ccat,i)+" 🪙"}</div><button class="s" onclick="style_('${ccat}',${i})" ${use||(!own&&S.coins<stp(ccat,i))?"disabled":""}>${own?"Usar":"Comprar"}</button></div>`}).join("")}</div>`;
  else if(ccat==="k")body=kgrid();
  else if(ccat==="z")body=zgrid();
  else if(ccat==="d")body=dgrid("d")+dgrid("p");
  else if(ccat==="x")body=xgrid();
  else if(ccat==="b")body=bgrid("b")+bgrid("s");
  else if(ccat==="t")body=mgrid("t","Mesas")+mgrid("c","Sillas");
  else body=`<div class="grid">${PRICE[ccat].map((pr,i)=>TERA[ccat]!=null&&i>=TERA[ccat]?"":`<div class="card item">${pv(ccat,i)}<b>${nameOf(ccat,i)}</b><div class="mut">${pr} 🪙 · vende ${Math.floor(pr/2)}</div><button class="s" onclick="buyItem('${ccat}',${i})" ${S.coins<pr?"disabled":""}>Comprar</button></div>`).join("")}</div>`;
  v.innerHTML=`<div class="card"><div id="slot"></div></div><p class="mut">${help}</p>${bar}<div class="chips">${CT.map(([k,n])=>`<button class="${k===ccat?"on":""}" onclick="ccat='${k}';note='';draw()">${n}${k==="i"?" ("+tot+")":""}</button>`).join("")}</div>${note?`<p class="mut">${note}</p>`:""}${body}`;
 }
 if(tab==="up"){
  const U=[["cam","🧑‍🍳 Camarero nuevo",`Tienes ${S.waiters}/10. Sirven más rápido y más platos al día.`],["chef","👨‍🍳 Cocinero",`Tienes ${S.chef}/${Math.min(10,fogN())} (un fogón por cocinero). Cocinan más rápido.${S.chef>=fogN()&&S.chef<10?" Amplía la cocina: cada nivel añade 1 fogón.":""}`],["rec","⭐ Mejorar recetas",`Nivel ${S.q}/10. Clientes más contentos: mañana viene más gente.`],["sal","🏠 Ampliar salón",`Nivel ${S.sal}/10. Ahora ${SCn()}×${SRn()} casillas, más sitio para muebles.`],["kit","🍳 Ampliar cocina",`Nivel ${S.kit}/10. Ahora ${fogN()} fogones (+1 por nivel) y más espacio.`],["ter","🌿 Ampliar terraza",terDesc()]];
  v.innerHTML=(note?`<p class="bad">${note}</p>`:"")+U.map(([t,n,d])=>`<div class="card"><div class="row"><div><b>${n}</b><div class="mut">${d}</div></div>${maxed(t)?`<span class="ok">Máximo</span>`:`<button class="s" onclick="upg('${t}')" ${S.coins<cost(t)||blocked(t)?"disabled":""}>${cost(t)} 🪙</button>`}</div></div>`).join("");
 }
attach();}
initLayout();if(S.shift)busy=S.shift.c.filter(c=>!c.paid).length;window.onresize=fit;draw();requestAnimationFrame(loop);
let hid=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){hid=Date.now();flush()}else{if(hid&&Date.now()-hid>20000)settle();hid=0}});
window.addEventListener("pagehide",flush);
resume();if(!S.name)askName();
(async()=>{try{if(!window.claude||!claude.use)return;const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const uid=await user.id();if(!uid)return;
 const ref=db.collection("data/users/"+uid).doc("game"),sn=await ref.get(),d=sn.exists?sn.data():null;remote=ref;
 if(d&&d.s&&(d.t||0)>(S.ts||0)){S=load(JSON.parse(d.s));S.ts=d.t;try{localStorage.setItem(KEY,d.s)}catch(e){}initLayout();if(S.shift)busy=S.shift.c.filter(c=>!c.paid).length;draw();resume();if(!S.name)askName()}else flush()}catch(e){}})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
